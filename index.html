<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe Allergies · Dashboard</title>
<style>
  :root {
    --bg: #F6FAFA; --card: #FFFFFF; --line: #E3ECEC;
    --text: #12312F; --muted: #6B8280; --faint: #9AB0AE;
    --accent: #12B5BA; --accent-soft: #E0F7F8;
    --warn: #B45309; --warn-bg: #FEF3C7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1B1A; --card: #142422; --line: #203634;
      --text: #E8F2F1; --muted: #7FA09D; --faint: #5C7B78;
      --accent: #2BC8CD; --accent-soft: #123B3D;
      --warn: #F5B45C; --warn-bg: #3A2A10;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 26px 20px 70px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between;
           gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; }
  h1 span { color: var(--accent); }
  .meta { display: flex; align-items: center; gap: 14px; }
  .stamp { color: var(--muted); font-size: 12.5px; }
  .signout { background: none; border: none; color: var(--muted);
             font-size: 12.5px; cursor: pointer; text-decoration: underline; }

  /* Periodefilter */
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line);
         border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: none; color: var(--muted);
    font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 8px;
    cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button:disabled { opacity: 0.5; cursor: default; }

  h2 { font-size: 12px; font-weight: 700; letter-spacing: 1.2px;
       text-transform: uppercase; color: var(--muted); margin: 34px 0 12px; }
  h2 small { text-transform: none; letter-spacing: 0; font-weight: 500;
             color: var(--faint); margin-left: 8px; }

  .grid { display: grid; gap: 14px;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .grid.flows { grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 18px; }
  .card > strong { font-size: 14.5px; }
  .cardhead { display: flex; justify-content: space-between;
              align-items: baseline; gap: 8px; }

  /* KPI's */
  .kpi .n { font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  /* Staafgrafiek */
  .bars { display: flex; align-items: flex-end; gap: 3px;
          height: 84px; margin: 14px 0 6px; }
  .bcol { flex: 1; display: flex; flex-direction: column;
          justify-content: flex-end; align-items: center; gap: 3px; min-width: 0; }
  .bval { font-size: 10.5px; line-height: 1; color: var(--muted);
          font-variant-numeric: tabular-nums; }
  .bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; }
  .bar.zero { background: var(--line); }
  .ticks { display: flex; justify-content: space-between;
           color: var(--faint); font-size: 11.5px; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
           font-size: 12px; font-weight: 700; white-space: nowrap;
           background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }

  /* Tabellen */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px;
          margin-top: 8px; }
  td { padding: 8px 4px; border-top: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums;
           font-weight: 600; }
  tr:first-child td { border-top: none; }
  .note { color: var(--faint); font-size: 12.5px; }

  /* Flow-diagram */
  .fs { margin-top: 12px; }
  .fs-head { display: flex; justify-content: space-between; gap: 8px;
             font-size: 13.5px; margin-bottom: 5px; }
  .fs-num { color: var(--muted); font-variant-numeric: tabular-nums;
            font-weight: 600; white-space: nowrap; }
  .fs-trk { height: 20px; background: var(--accent-soft); border-radius: 6px;
            overflow: hidden; }
  .fs-fil { height: 100%; background: var(--accent); border-radius: 6px;
            min-width: 3px; }
  .fs-drop { margin: 8px 0 -2px; color: var(--faint); font-size: 12px; }
  .fs-drop b { color: var(--warn); font-weight: 600; }

  /* Horizontale rijen (platform, top acties) */
  .rows { margin-top: 12px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 5px 0;
         font-size: 13.5px; }
  .row .lbl { flex: 0 0 46%; white-space: nowrap; overflow: hidden;
              text-overflow: ellipsis; }
  .row .trk { flex: 1; height: 8px; background: var(--line);
              border-radius: 4px; overflow: hidden; }
  .row .fil { display: block; height: 100%; background: var(--accent);
              border-radius: 4px; }
  .row .cnt { flex: 0 0 auto; color: var(--muted); font-size: 12.5px;
              font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Login */
  .login { max-width: 340px; margin: 12vh auto 0; }
  .login h1 { text-align: center; margin-bottom: 18px; }
  .login input { width: 100%; padding: 12px 14px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 15px; }
  .login button { width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; }
  .login .err { color: var(--warn); font-size: 13px; margin-top: 10px;
                text-align: center; min-height: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <h1>Safe <span>Allergies</span></h1>
  <input id="email" type="email" placeholder="E-mailadres" autocomplete="username">
  <input id="pass" type="password" placeholder="Wachtwoord" autocomplete="current-password">
  <button id="loginBtn">Inloggen</button>
  <div class="err" id="loginErr"></div>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <h1>Safe <span>Allergies</span> dashboard</h1>
    <div class="meta">
      <div class="seg" id="seg"></div>
      <span class="stamp" id="stamp"></span>
      <button class="signout" id="signout">uitloggen</button>
    </div>
  </header>

  <h2>Totalen <small>alles sinds de start</small></h2>
  <div class="grid" id="totals"></div>

  <h2>Groei <small id="growthNote"></small></h2>
  <div class="grid wide" id="trends"></div>

  <h2>Gebruik <small id="usageNote"></small></h2>
  <div class="grid wide" id="usage"></div>

  <h2>Flows <small id="flowNote"></small></h2>
  <div class="grid flows" id="flows"></div>

  <h2>Acties en platform <small id="actionsNote"></small></h2>
  <div class="grid wide" id="actions"></div>

  <h2>Datakwaliteit</h2>
  <div class="grid wide" id="quality"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://lrfpiscnfoqhzjvussyz.supabase.co";
const ANON_KEY = "sb_publishable_EseLz8yQfxqK7gbjyRT3aA_B0xCsMVK";
const supa = createClient(SUPABASE_URL, ANON_KEY);

const $ = (id) => document.getElementById(id);
const fmt = (n) => (n ?? 0).toLocaleString("nl-NL");
const fmtDay = (d) => new Date(d).toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
const PERIODS = [7, 14, 30, 90];
let days = PERIODS.includes(+localStorage.getItem("sa_days"))
  ? +localStorage.getItem("sa_days") : 14;
let session = null;

/* ── Bouwstenen ─────────────────────────────────────────── */

function kpi(label, value) {
  return `<div class="card kpi"><div class="n">${fmt(value)}</div><div class="l">${label}</div></div>`;
}

// Meer dan ~31 punten leest niet als dagstaafjes; bundel dan per week.
function bucketize(series) {
  if (series.length <= 31) return { series, unit: "per dag" };
  const out = [];
  for (let i = 0; i < series.length; i += 7) {
    const chunk = series.slice(i, i + 7);
    out.push({ d: chunk[0].d, n: chunk.reduce((a, p) => a + p.n, 0) });
  }
  return { series: out, unit: "per week" };
}

function barChart(rawSeries, label, total) {
  const { series, unit } = bucketize(rawSeries);
  const max = Math.max(1, ...series.map((p) => p.n));
  const showVals = series.length <= 31;
  const bars = series.map((p) => {
    const h = Math.round((p.n / max) * 58);
    return `<div class="bcol" title="${fmtDay(p.d)}: ${fmt(p.n)}">
      ${showVals ? `<span class="bval">${p.n > 0 ? p.n : ""}</span>` : ""}
      <div class="bar${p.n === 0 ? " zero" : ""}" style="height:${Math.max(h, 3)}px"></div>
    </div>`;
  }).join("");
  const mid = series[Math.floor(series.length / 2)];
  return `<div class="card">
    <div class="cardhead"><strong>${label}</strong><span class="badge">${total}</span></div>
    <div class="bars">${bars}</div>
    <div class="ticks"><span>${fmtDay(series[0]?.d)}</span>
      <span>${series.length > 4 ? fmtDay(mid?.d) : ""}</span>
      <span>${fmtDay(series[series.length - 1]?.d)}</span></div>
    <div class="note" style="margin-top:4px">${unit}</div>
  </div>`;
}

// Flow: per stap een volle balk met aantal en percentage, en tussen de
// stappen expliciet de uitval — dat is waar je op stuurt.
function flowCard(title, steps, note, count) {
  const base = count[steps[0][0]] ?? 0;
  let html = "", prev = null;
  for (const [key, label] of steps) {
    const n = count[key] ?? 0;
    const pct = base > 0 ? Math.round((n / base) * 100) : 0;
    if (prev !== null && prev > 0 && prev - n > 0) {
      const dropPct = Math.round(((prev - n) / prev) * 100);
      html += `<div class="fs-drop">↓ <b>${fmt(prev - n)} afgehaakt</b> (${dropPct}% van de vorige stap)</div>`;
    }
    html += `<div class="fs">
      <div class="fs-head"><span>${label}</span><span class="fs-num">${fmt(n)} · ${pct}%</span></div>
      <div class="fs-trk"><div class="fs-fil" style="width:${Math.max(pct, 1)}%"></div></div>
    </div>`;
    prev = n;
  }
  const endPct = base > 0
    ? Math.round(((count[steps[steps.length - 1][0]] ?? 0) / base) * 100) : 0;
  return `<div class="card">
    <div class="cardhead"><strong>${title}</strong><span class="badge">${endPct}% conversie</span></div>
    ${html}
    <div class="note" style="margin-top:12px">${note}</div>
  </div>`;
}

function barRows(pairs, labelFn) {
  const max = Math.max(1, ...pairs.map(([, n]) => n));
  return pairs.map(([k, n]) =>
    `<div class="row"><span class="lbl">${labelFn(k)}</span>
      <span class="trk"><span class="fil" style="width:${Math.round((n / max) * 100)}%"></span></span>
      <span class="cnt">${fmt(n)}</span></div>`).join("");
}

const EVENT_LABELS = {
  restaurant_opened: "Restaurant bekeken", restaurant_searched: "Zoekopdracht",
  restaurant_added: "Restaurant toegevoegd", favorite_toggled: "Favoriet gewijzigd",
  map_view_opened: "Kaart geopend", map_marker_tapped: "Kaartpin getikt",
  map_search_this_area_tapped: "Zoek dit gebied", review_posted: "Review geplaatst",
  review_upvote_added: "Review-duim omhoog", dish_added: "Gerecht toegevoegd",
  dish_validation_voted: "Gerecht gevalideerd", allergy_menu_photo_uploaded: "Menufoto geupload",
  onboarding_step_completed: "Onboarding-stap", onboarding_completed: "Onboarding afgerond",
  guest_mode_entered: "Gastmodus gestart", account_gate_shown: "Accountvraag getoond",
  account_gate_converted: "Account na gastmodus", account_gate_dismissed: "Accountvraag weggeklikt",
  signed_up: "Aangemeld", logged_in: "Ingelogd", signed_out: "Uitgelogd",
  language_changed: "Taal gewijzigd",
  medical_disclaimer_acknowledged: "Disclaimer geaccepteerd",
  community_guidelines_accepted: "Richtlijnen geaccepteerd",
  supporter_screen_opened: "Supporter-scherm bekeken",
  supporter_prompt_shown: "Supporter-uitnodiging getoond",
  feedback_submitted: "Feedback verstuurd", content_reported: "Inhoud gemeld",
  review_prompt_requested: "Beoordeel-ons-vraag",
};
const prettify = (ev) => EVENT_LABELS[ev] ??
  (ev.charAt(0).toUpperCase() + ev.slice(1)).replaceAll("_", " ");
const OS_LABELS = { iOS: "iPhone", Android: "Android" };

/* ── Data laden ─────────────────────────────────────────── */

function setLoading() {
  const ph = '<div class="card note">Laden…</div>';
  for (const id of ["trends", "usage", "flows", "actions"]) $(id).innerHTML = ph;
  const label = `afgelopen ${days} dagen`;
  $("growthNote").textContent = label;
  $("usageNote").textContent = label;
  $("flowNote").textContent = label + "; het verschil per stap is de uitval";
  $("actionsNote").textContent = label;
}

async function loadSupabase() {
  const { data, error } = await supa.rpc("admin_dashboard_stats", { days });
  if (error) throw new Error(error.message);
  const t = data.totals, q = data.quality;

  $("stamp").textContent = "bijgewerkt " +
    new Date(data.generated_at).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });

  $("totals").innerHTML =
    kpi("gebruikers", t.users) +
    kpi("restaurants live", t.restaurants_approved) +
    kpi("in de wachtrij", t.restaurants_pending) +
    kpi("reviews", t.reviews) +
    kpi("gerechten", t.dishes) +
    kpi("favorieten", t.favorites) +
    kpi("supporters", t.supporters);

  const sum = (s) => s.reduce((a, p) => a + p.n, 0);
  $("trends").innerHTML =
    barChart(data.users_daily, "Nieuwe gebruikers", `${fmt(sum(data.users_daily))} totaal`) +
    barChart(data.reviews_daily, "Nieuwe reviews", `${fmt(sum(data.reviews_daily))} totaal`) +
    barChart(data.restaurants_daily, "Nieuwe restaurants", `${fmt(sum(data.restaurants_daily))} totaal`);

  const pending = q.pending_list.map((r) =>
    `<tr><td>${r.name}</td><td class="num" style="color:var(--muted)">${fmtDay(r.created_at)}</td></tr>`).join("");
  $("quality").innerHTML =
    `<div class="card">
       <strong>Controlepunten</strong>
       <table>
         <tr><td>Restaurants met 100%-claims</td>
             <td class="num"><span class="badge ${q.with_claims > 0 ? "warn" : ""}">${q.with_claims}</span></td></tr>
         <tr><td>“Heeft allergiemenu” zonder bewijs</td>
             <td class="num"><span class="badge ${q.menu_without_evidence > 0 ? "warn" : ""}">${q.menu_without_evidence}</span></td></tr>
       </table>
     </div>
     <div class="card">
       <strong>Wachtrij (${q.pending_list.length})</strong>
       <table>${pending || '<tr><td class="note">Leeg — alles beoordeeld.</td></tr>'}</table>
     </div>`;
}

async function loadPosthog() {
  const r = await fetch(SUPABASE_URL + "/functions/v1/dashboard/posthog", {
    method: "POST",
    headers: {
      Authorization: "Bearer " + session.access_token,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ days }),
  });
  const d = await r.json();
  if (!d.configured) {
    $("usage").innerHTML =
      '<div class="card note">PostHog nog niet gekoppeld — zet de secrets ' +
      "POSTHOG_API_KEY en POSTHOG_PROJECT_ID op de functie en herlaad.</div>";
    $("flows").innerHTML = "";
    $("actions").innerHTML = "";
    return;
  }
  if (d.error) throw new Error(d.error);

  const s = d.scalars;
  const dau = d.dau.map(([day, n]) => ({ d: day, n }));
  const last7 = dau.slice(-7);
  const avgDau = last7.reduce((a, p) => a + p.n, 0) / Math.max(1, last7.length);
  const stickiness = s.mau > 0 ? Math.round((avgDau / s.mau) * 100) : 0;

  $("usage").innerHTML =
    barChart(dau, "Actieve gebruikers", `${fmt(dau[dau.length - 1]?.n ?? 0)} vandaag`) +
    `<div class="card">
      <strong>Engagement</strong>
      <table>
        <tr><td>Actief afgelopen 7 dagen</td><td class="num">${fmt(s.wau)}</td></tr>
        <tr><td>Actief afgelopen 30 dagen</td><td class="num">${fmt(s.mau)}</td></tr>
        <tr><td>Stickiness <span class="note">(dagelijks / maandelijks)</span></td>
            <td class="num"><span class="badge">${stickiness}%</span></td></tr>
        <tr><td>App-fouten in de periode</td>
            <td class="num"><span class="badge ${s.errors > 0 ? "warn" : ""}">${fmt(s.errors)}</span></td></tr>
      </table>
    </div>` +
    `<div class="card">
      <strong>Zoeken en gasten</strong>
      <table>
        <tr><td>Gebruikers die zochten</td><td class="num">${fmt(s.search_users)}</td></tr>
        <tr><td>Zoekopdrachten totaal</td><td class="num">${fmt(s.search_total)}</td></tr>
        <tr><td>Gastgebruikers in de periode</td><td class="num">${fmt(s.guests)}</td></tr>
        <tr><td>Gastgebruikers afgelopen 30 dagen</td><td class="num">${fmt(s.guests_30d)}</td></tr>
      </table>
    </div>`;

  const fCount = Object.fromEntries(d.funnel.map(([ev, n]) => [ev, n]));
  const note = `unieke gebruikers, afgelopen ${d.days} dagen`;
  $("flows").innerHTML =
    flowCard("Onboarding", [
      ["step_welcome", "Welkomscherm voorbij"],
      ["step_allergy_setup", "Allergieen gekozen"],
      ["step_location_setup", "Locatie-stap voorbij"],
      ["step_account_setup", "Account-stap voorbij"],
      ["onboarding_completed", "Onboarding afgerond"],
    ], note, fCount) +
    flowCard("Gast naar account", [
      ["account_gate_shown", "Accountvraag gezien"],
      ["account_gate_converted", "Account aangemaakt"],
    ], note, fCount) +
    flowCard("Supporter worden", [
      ["supporter_screen_opened", "Scherm bekeken"],
      ["supporter_purchase_started", "Aankoop gestart"],
      ["supporter_purchase_completed", "Aankoop afgerond"],
    ], note, fCount);

  $("actions").innerHTML =
    `<div class="card"><strong>Meest gedane acties</strong>
      <div class="rows">${barRows(d.events, prettify)}</div>
    </div>` +
    `<div class="card"><strong>Platform</strong>
      <div class="rows">${barRows(d.platform, (os) => OS_LABELS[os] ?? os ?? "Onbekend")}</div>
    </div>`;
}

async function loadAll() {
  setLoading();
  for (const b of document.querySelectorAll("#seg button")) b.disabled = true;
  try {
    await loadSupabase();
    try {
      await loadPosthog();
    } catch (e) {
      const msg = `<div class="card note">PostHog-cijfers konden niet geladen worden (${e.message}).</div>`;
      $("usage").innerHTML = msg; $("flows").innerHTML = ""; $("actions").innerHTML = "";
    }
  } catch (e) {
    await supa.auth.signOut();
    $("app").hidden = true;
    $("login").hidden = false;
    $("loginErr").textContent = "Ingelogd, maar data laden mislukte: " + e.message;
  } finally {
    for (const b of document.querySelectorAll("#seg button")) b.disabled = false;
  }
}

/* ── Periodefilter en auth ──────────────────────────────── */

function renderSeg() {
  $("seg").innerHTML = PERIODS.map((p) =>
    `<button data-d="${p}" class="${p === days ? "on" : ""}">${p} dgn</button>`).join("");
  for (const b of document.querySelectorAll("#seg button")) {
    b.onclick = () => {
      days = +b.dataset.d;
      localStorage.setItem("sa_days", days);
      renderSeg();
      loadAll();
    };
  }
}

function show(s) {
  session = s;
  $("login").hidden = true;
  $("app").hidden = false;
  renderSeg();
  loadAll();
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const { data, error } = await supa.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("pass").value,
  });
  if (error) { $("loginErr").textContent = "Inloggen mislukt: " + error.message; return; }
  show(data.session);
};
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("signout").onclick = async () => { await supa.auth.signOut(); location.reload(); };

const { data: { session: existing } } = await supa.auth.getSession();
if (existing) show(existing); else $("login").hidden = false;
</script>
</body>
</html>
